<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hope Hands Charity Foundation | Enquiry</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

    <!-- Header and Navigation -->
    <header>

        <nav class="navbar">

            <div class="logo">
                <a href="index.html">Hope Hands</a>
            </div>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Programmes</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>


    <main>

        <!-- Page Banner -->
        <section class="page-banner">

            <h1>Make an Enquiry</h1>

            <p>
                We would love to hear from you.
            </p>

        </section>


        <!-- Enquiry Form -->
        <section class="form-section">

            <div class="form-container">

                <h2>Get Involved</h2>

                <p>
                    Complete the form below and our team will respond
                    to your enquiry.
                </p>


                <form id="enquiryForm">

                    <label for="name">
                        Full Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">
                        Email Address:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >


                    <label for="phone">
                        Phone Number:
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <label for="enquiryType">
                        Enquiry Type:
                    </label>

                    <select id="enquiryType" name="enquiryType" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="volunteer">
                            Volunteer
                        </option>

                        <option value="donation">
                            Donation
                        </option>

                        <option value="sponsorship">
                            Sponsorship
                        </option>

                        <option value="partnership">
                            Partnership
                        </option>

                        <option value="general">
                            General Enquiry
                        </option>

                    </select>


                    <label for="message">
                        Message:
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Enter your message"
                        required
                    ></textarea>


                    <button type="submit" class="btn">
                        Submit Enquiry
                    </button>

                </form>


                <p id="formMessage"></p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; <span id="year"></span>
            Hope Hands Charity Foundation.
            All Rights Reserved.
        </p>

        <p>Created for academic purposes.</p>

    </footer>


    <script src="CSS/js/script.js"></script>

</body>
</html>
